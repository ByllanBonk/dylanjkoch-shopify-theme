<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're In &#8212; Check Your Inbox</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="You're In. Check Your Inbox.">
  <meta property="og:description" content="Thanks for grabbing the Direct-to-Fan Operating System. It's already on its way to your email inbox.">
  <meta property="og:type" content="website">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      background-color: #05070A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .accent-bar {
      width: 100%;
      height: 4px;
      background-color: #38BDF8;
    }

    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 64px 24px 48px;
      text-align: center;
    }

    .eyebrow {
      color: #38BDF8;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .subhead {
      color: #9CA3AF;
      font-size: 17px;
      line-height: 1.6;
      max-width: 480px;
      margin: 0 auto 32px;
    }

    .cta-button {
      display: inline-block;
      background-color: #38BDF8;
      color: #000000;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 6px;
      transition: opacity 0.15s ease;
    }

    .cta-button:hover {
      opacity: 0.85;
    }

    .reassurance {
      color: #9CA3AF;
      font-size: 13px;
      margin-top: 16px;
    }

    .brand-image {
      display: block;
      width: 100%;
      max-width: 360px;
      height: auto;
      margin: 48px auto 0;
    }

    footer {
      color: #9CA3AF;
      font-size: 13px;
      text-align: center;
      padding: 24px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 48px 20px 40px;
      }

      h1 {
        font-size: 30px;
      }

      .subhead {
        font-size: 16px;
      }

      .cta-button {
        display: block;
        width: 100%;
      }

      .brand-image {
        max-width: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="accent-bar"></div>

  <main class="page">
    <p class="eyebrow">You're In</p>
    <h1>Check Your Inbox</h1>
    <p class="subhead">Thanks for grabbing the Direct-to-Fan Operating System. It's already on its way to your email inbox. If you don't want to wait, grab it right here.</p>

    <a class="cta-button" href="https://cdn.shopify.com/s/files/1/0778/6237/1516/files/The-Direct-to-Fan-Operating-System_Playbook.pdf?v=1784039370" target="_blank" rel="noopener">Download the Playbook Now</a>

    <p class="reassurance">Also sent to your inbox in case you want it later.</p>

    <!-- Replace REPLACE_WITH_IMAGE_URL.png with the hosted transparent PNG URL -->
    <img class="brand-image" src="REPLACE_WITH_IMAGE_URL.png" alt="Dylan Koch">
  </main>

  <footer>Dylan Koch &middot; Direct-to-Fan Marketing</footer>
</body>
</html>
